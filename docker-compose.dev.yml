services:
  site-dev:
    image: node:22-alpine
    container_name: jmattosdev-dev
    working_dir: /app
    ports:
      - "3001:3001"
      - "5173:5173" 
    volumes:
      - .:/app
      - /app/node_modules 
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    command: sh -c "npm install --include=dev && npm run dev"