services:
  site-dev:
    image: node:22-alpine
    container_name: jmattosdev-dev
    working_dir: /app
    ports:
      - "3001:3001"
      - "5173:5173" # Libera a porta do Vite para o Hot Reload funcionar
    volumes:
      - .:/app
      - /app/node_modules # Evita conflitos entre o Node do Windows/WSL e o do Linux Alpine
    env_file:
      - .env
    command: sh -c "npm install && npm run dev"